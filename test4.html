<!DOCTYPE html>
<html><body style="background:#111;color:#0f0;font-family:monospace;padding:20px;">
<pre id="log">Test4: cache-busted App.js import...</pre>
<script type="module">
const log = document.getElementById('log');
const add = msg => { log.textContent += '\n' + msg; };
try {
  const v = Date.now();
  add('1. Trying App.js with cache bust...');
  const mod = await import('./js/presentation/App.js?' + v);
  add('2. App loaded! Keys: ' + Object.keys(mod).join(', '));
} catch(e) {
  add('FAIL: ' + e.message);
  add(e.stack);
  add('\nTrying to parse it manually...');
  const resp = await fetch('./js/presentation/App.js?' + v);
  const text = await resp.text();
  // Check each import line resolves
  const importLines = text.match(/from ['"]([^'"]+)['"]/g);
  add('Import lines found: ' + JSON.stringify(importLines));
  for (const line of importLines) {
    const path = line.match(/['"]([^'"]+)['"]/)[1];
    const resolved = new URL(path, 'https://ehchandlerjr.github.io/hvac-monitor/js/presentation/App.js').href;
    try {
      const r = await fetch(resolved);
      add(r.ok ? 'OK: ' + path : 'MISSING: ' + path + ' -> ' + r.status);
    } catch(e2) {
      add('ERR: ' + path + ' -> ' + e2.message);
    }
  }
}
</script>
</body></html>
