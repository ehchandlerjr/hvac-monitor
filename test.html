<!DOCTYPE html>
<html><body style="background:#111;color:#0f0;font-family:monospace;padding:20px;">
<pre id="log">Starting...</pre>
<script type="module">
const log = document.getElementById('log');
const add = msg => { log.textContent += '\n' + msg; };
try {
  add('1. Importing modules...');
  const { MockAdapter } = await import('./js/infrastructure/adapters/MockAdapter.js');
  add('2. MockAdapter loaded OK');
  const mock = new MockAdapter();
  const readings = await mock.fetchReadings(6);
  add('3. Mock readings: ' + readings.length);
  const { SupabaseAdapter } = await import('./js/infrastructure/adapters/SupabaseAdapter.js');
  add('4. SupabaseAdapter loaded OK');
  const { SUPABASE_CONFIG, buildZoneGraph } = await import('./js/infrastructure/config/SensorRegistry.js');
  add('5. Config: url=' + SUPABASE_CONFIG.url.substring(0,30) + '...');
  const zones = buildZoneGraph();
  add('6. Zones built: ' + zones.map(z=>z.name).join(', '));
  const { ThemeEngine } = await import('./js/presentation/engine/ThemeEngine.js');
  add('7. ThemeEngine loaded OK');
  const { App } = await import('./js/presentation/App.js');
  add('8. App loaded OK');
  add('\nALL IMPORTS PASSED - issue is in app.start()');
} catch(e) {
  add('\nFAILED: ' + e.message);
  add(e.stack);
}
</script>
</body></html>
