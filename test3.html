<!DOCTYPE html>
<html><body style="background:#111;color:#0f0;font-family:monospace;padding:20px;">
<pre id="log">Testing App.js directly...</pre>
<script type="module">
const log = document.getElementById('log');
const add = msg => { log.textContent += '\n' + msg; };
try {
  const resp = await fetch('./js/presentation/App.js');
  add('Fetch status: ' + resp.status);
  add('Content-Type: ' + resp.headers.get('content-type'));
  const text = await resp.text();
  add('File size: ' + text.length + ' chars');
  add('First 200 chars:\n' + text.substring(0,200));
  add('\nLast 200 chars:\n' + text.substring(text.length-200));
} catch(e) {
  add('FAIL: ' + e.message);
}
</script>
</body></html>
